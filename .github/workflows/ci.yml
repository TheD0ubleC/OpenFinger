name: CI

on:
  push:
    branches: [main, master, dev, release/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows build and package verification
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Prepare espflash
        shell: pwsh
        run: |
          $version = '4.4.0'
          $asset = 'espflash-x86_64-pc-windows-msvc.zip'
          $url = "https://github.com/esp-rs/espflash/releases/download/v$version/$asset"
          $workDir = Join-Path $env:RUNNER_TEMP 'espflash'
          $zipPath = Join-Path $workDir $asset
          $extractDir = Join-Path $workDir 'extract'
          $destDir = Join-Path $PWD '.codex_temp/cargo-root/bin'
          New-Item -ItemType Directory -Force -Path $workDir, $extractDir, $destDir | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir -Force
          $exe = Get-ChildItem -Path $extractDir -Filter 'espflash.exe' -Recurse | Select-Object -First 1
          if (-not $exe) {
            throw "espflash.exe not found in $asset"
          }
          Copy-Item -LiteralPath $exe.FullName -Destination (Join-Path $destDir 'espflash.exe') -Force

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build native components
        run: cmake --build build --config Release --parallel

      - name: Build GUI
        run: dotnet build src/OpenFinger.Control/OpenFinger.Control.csproj -c Release

      - name: Package
        run: python x.py package --config Release --skip-build --archive-format zip --distribution all --runtime-mode all

      - name: Verify package layout
        run: python x.py verify-package --config Release --archive-format zip --distribution all --runtime-mode all

      - name: Upload CI package artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenFinger-ci-win-x64
          path: |
            dist/OpenFinger-*-win-x64-*.zip
            dist/OpenFinger-*-win-x64-*.zip.sha256
            dist/OpenFingerSetup-*-win-x64-*.exe
            dist/OpenFingerSetup-*-win-x64-*.exe.sha256
            dist/OpenFinger-*-checksums.sha256
            dist/release-notes.md
          if-no-files-found: error
