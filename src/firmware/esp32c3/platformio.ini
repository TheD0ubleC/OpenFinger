[platformio]
default_envs = esp32-c3-dev-module
src_dir = src

[env:esp32-c3-dev-module]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -I../common
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DOPENFINGER_LED_PIN=8
    -DOPENFINGER_LED_ACTIVE_LOW=1
    -DOPENFINGER_LED_IS_NEOPIXEL=0
